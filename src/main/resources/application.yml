spring:
  application:
    name: zhikao-server
  profiles:
    active: dev
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  # 数据源配置（T2.3 建表后启用）
  datasource:
    url: jdbc:mysql://localhost:3306/zhikao?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: localhost
      port: 6379
      database: 0

server:
  port: 8080

# JWT 认证（T2.4；生产环境 secret 必须通过环境变量注入）
zhikao:
  jwt:
    secret: zhikao-dev-secret-key-please-change-in-production-2026
    access-token-ttl-ms: 1800000      # Access Token 30 分钟
    refresh-token-ttl-ms: 604800000   # Refresh Token 7 天
    admin-secret: zhikao-admin-secret-please-change-in-production-2026
    admin-token-ttl-ms: 7200000       # 管理员 Token 2 小时
  # 管理员账号（T3.1 开发期方案：配置存储；任务书未定义 admin_user 表，
  # 待契约补充后迁移至数据库，见 14.4 契约优先流程）
  admin:
    username: admin
    password: admin123456

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# knife4j / springdoc
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
knife4j:
  enable: true
  setting:
    language: zh_cn

logging:
  level:
    com.zhikao.server: debug
